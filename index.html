<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kaspi QR-codes</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<body style="background-color: rgb(246, 246, 246)">
    <div class="input-group no-print">
        <span class="input-group-text">JSON-link</span>
        <input type="text" class="form-control" placeholder="https://" id="link">
        <button class="btn btn-outline-secondary" type="button" onclick="generate()">Сгенерировать QR-коды</button>
        <button class="btn btn-outline-primary" type="button" onclick="downloadSvg()">Скачать SVG</button>
    </div>
    <hr class="no-print">
    <div id="qr-codes">

    </div>
    <!-- <script src="http://code.jquery.com/jquery-1.8.0.min.js"></script> -->
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="qrcode.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
